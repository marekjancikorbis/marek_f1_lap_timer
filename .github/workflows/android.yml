# Builds the Android app (Capacitor around the same web build as the PWA) whenever the app changes,
# and publishes it as the latest GitHub release: the PWA's "Get the Android app" button downloads
# releases/latest/download/purple-sector.apk. Needs the ANDROID_KEYSTORE (base64 of the .jks) and
# ANDROID_KEYSTORE_PASSWORD secrets; the key must stay the same, or phones refuse to update the app
# and Google sign-in stops working (its fingerprint is registered in Firebase).
name: Android app

on:
  push:
    branches: [main]
    paths: [apps/web/**, packages/**, package-lock.json, .github/workflows/android.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
        working-directory: apps/web
      - name: Build the signed APK
        working-directory: apps/web/android
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "::error::Add the ANDROID_KEYSTORE and ANDROID_KEYSTORE_PASSWORD secrets"; exit 1; fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks" ./gradlew assembleRelease -PversionCode=${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/purple-sector.apk"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "android-${{ github.run_number }}" "$RUNNER_TEMP/purple-sector.apk"
          --title "Android app 1.0.${{ github.run_number }}"
          --notes "Built from ${{ github.sha }}." --latest
