
<section class="g-sec" id="start">
  <h2>Sign in</h2>
  <p>The first three screens a new driver sees. The car's navy panel introduces the brand once, then the app gets out of the way.</p>
  <div class="shots">

    <figure class="shot">
      <div class="phone">
        <div class="panel on-panel" style="height:420px;padding-top:0">
          <div class="livery" style="width:160px;right:-80px"><i></i><i></i><i></i></div>
          <div class="sb">9:41</div>
          <div style="position:absolute;left:24px;bottom:34px;right:150px">
            <div class="wordmark" style="font-size:44px;line-height:.95">Purple<br>Sector</div>
            <p class="sub" style="margin-top:14px;font-size:15px">Time your drives on tracks and closed roads, and race the lap you want to beat.</p>
          </div>
        </div>
        <div class="pad" style="padding-top:22px;display:grid;gap:14px">
          <div class="seg"><span class="on">Sign in</span><span>Create account</span></div>
          <div class="field"><label>Email</label><div class="input">tomas@example.com</div></div>
          <div class="field"><label>Password</label><div class="input focus">••••••••<span style="flex:1"></span><svg class="i sm" style="color:var(--mute)"><use href="#i-eye"/></svg></div></div>
          <button class="btn primary block">Sign in</button>
          <div style="text-align:center;font-size:14px;font-weight:700;color:var(--navy);text-decoration:underline;text-underline-offset:3px">Forgot password</div>
        </div>
      </div>
      <figcaption><b>Sign in</b>The brand panel takes the top half once; the form sits low enough for a thumb. Create account swaps the button label and adds the 6-character hint.</figcaption>
    </figure>

    <figure class="shot">
      <div class="phone">
        <div class="sb">9:41</div>
        <div class="pad" style="padding-top:40px;display:grid;gap:20px">
          <div class="ls" style="width:120px"><b class="p"></b><b class="g"></b><b class="y"></b></div>
          <h1 class="h1" style="font-size:34px">Pick a username</h1>
          <p class="body-s">Other drivers find you by it and see it on every lap you post.</p>
          <div style="display:flex;gap:14px;align-items:center">
            <span class="rd l c1">TK</span>
            <div style="display:grid;gap:4px"><b style="font-size:18px">tomas_k</b><span class="sub">Your roundel until you add a photo</span></div>
          </div>
          <div class="field"><label>Username</label><div class="input focus"><span style="color:var(--mute)">@</span>tomas_k<span style="flex:1"></span><svg class="i sm ink-g"><use href="#i-check"/></svg></div>
            <span class="hint">3–20 characters: letters, numbers, _ and .</span></div>
        </div>
        <div class="pad" style="position:absolute;left:0;right:0;bottom:40px"><button class="btn primary block">Continue</button></div>
      </div>
      <figcaption><b>Pick a username</b>The roundel previews how this driver will appear everywhere. The check mark means the name is free.</figcaption>
    </figure>

    <figure class="shot">
      <div class="phone">
        <div class="sb">9:41</div>
        <div class="bar"><span class="ib"><svg class="i"><use href="#i-close"/></svg></span><span class="title"></span></div>
        <div class="pad" style="display:grid;gap:18px;padding-top:4px">
          <h1 class="h1" style="font-size:32px">Before your first drive</h1>
          <p style="font-size:17px;font-weight:600">Purple Sector is for track days and rally events.</p>
          <div class="list">
            <div class="row" style="align-items:flex-start"><svg class="i" style="margin-top:2px"><use href="#i-flag"/></svg><div class="grow body-s">Only time yourself where timed driving is allowed and the road is closed to traffic.</div></div>
            <div class="row" style="align-items:flex-start"><svg class="i" style="margin-top:2px"><use href="#i-shield"/></svg><div class="grow body-s">You drive at your own risk and are responsible for following the rules of the venue and the law.</div></div>
            <div class="row" style="align-items:flex-start"><svg class="i" style="margin-top:2px"><use href="#i-clock"/></svg><div class="grow body-s">Timing starts when you move off after GO. Moving more than 10 m before GO adds 5 s.</div></div>
          </div>
        </div>
        <div class="pad" style="position:absolute;left:0;right:0;bottom:40px;display:grid;gap:10px">
          <button class="btn primary block">I agree</button>
          <button class="btn ghost block">Not now</button>
        </div>
      </div>
      <figcaption><b>Terms before the first drive</b>Shown once, before the first Start. Three short rows instead of a wall of text.</figcaption>
    </figure>

  </div>
</section>
