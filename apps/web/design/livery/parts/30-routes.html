
<section class="g-sec" id="routes">
  <h2>Routes</h2>
  <p>Drivers build their own private routes; approved creators publish them with a leaderboard. Route shapes are always drawn at the same scale and orientation, so laps on one route line up when compared.</p>
  <div class="shots">

    <!-- MY ROUTES -->
    <figure class="shot">
      <div class="phone">
        <div class="sb">9:41</div>
        <div class="bar" style="padding-left:16px"><span class="title" style="font-size:24px;font-weight:900;font-style:italic;text-transform:uppercase">Routes</span><button class="btn primary sm" style="margin-right:8px"><svg class="i sm"><use href="#i-plus"/></svg>Build</button></div>
        <div class="pad"><div class="seg"><span class="on">Routes I built</span><span>My laps</span></div></div>
        <div class="pad" style="padding-top:14px;display:grid;gap:10px">
          <article class="card" style="padding:14px;display:grid;grid-template-columns:76px 1fr;gap:14px;align-items:center">
            <svg viewBox="0 0 76 64" style="width:76px;height:64px;background:#f4f6f9;border-radius:10px"><path d="M10 54 C20 46 16 34 28 32 S38 14 50 16 S64 10 68 8" stroke="#0e1b3d" stroke-width="3.5" fill="none" stroke-linecap="round"/><circle cx="10" cy="54" r="4" fill="#0e1b3d"/></svg>
            <div><div style="display:flex;gap:6px;align-items:center"><b>Ecce Homo hill-climb</b></div><div class="sub">3.42 km · point to point · standing</div>
              <div style="display:flex;gap:6px;margin-top:8px"><span class="chip n"><svg class="i sm" style="width:12px;height:12px"><use href="#i-globe"/></svg>Public</span><span class="chip">9 drivers</span></div></div>
          </article>
          <article class="card" style="padding:14px;display:grid;grid-template-columns:76px 1fr;gap:14px;align-items:center">
            <svg viewBox="0 0 76 64" style="width:76px;height:64px;background:#f4f6f9;border-radius:10px"><path d="M14 50 L14 18 Q14 10 24 10 L56 10 Q66 10 62 20 L52 34 Q48 40 58 46 L60 52 L20 54 Q14 54 14 50Z" stroke="#0e1b3d" stroke-width="3.5" fill="none" stroke-linejoin="round"/></svg>
            <div><b>Club sprint, Saturday loop</b><div class="sub">2.10 km · lap · rolling</div>
              <div style="display:flex;gap:6px;margin-top:8px"><span class="chip"><svg class="i sm" style="width:12px;height:12px"><use href="#i-lock"/></svg>Private</span><button class="btn ghost sm" style="height:26px;font-size:11px;padding:0 10px">Publish</button></div></div>
          </article>
        </div>
        <div class="pad" style="padding-top:14px">
          <div class="card on-panel" style="padding:16px;display:grid;gap:10px;background:var(--navy);color:#f7f9fc;position:relative;overflow:hidden">
            <div class="livery thin" style="width:60px"><i></i><i></i><i></i></div>
            <b style="font-size:17px;position:relative;max-width:260px">Want to publish a route?</b>
            <p style="font-size:14px;color:var(--on-navy-2);position:relative;max-width:270px">Publishing, with a leaderboard, is for approved creators. Ask the admin and say which track or event you want to time.</p>
            <div style="position:relative"><button class="btn inverse sm">Request creator access</button></div>
          </div>
        </div>
        <span class="sample">Sample data</span>
        <nav class="tabs"><span class="tab"><svg class="i"><use href="#i-feed"/></svg>Feed</span><span class="tab"><svg class="i"><use href="#i-search"/></svg>Explore</span><span class="tab"><span class="go">GO</span></span><span class="tab on"><svg class="i"><use href="#i-routes"/></svg>Routes</span><span class="tab"><svg class="i"><use href="#i-user"/></svg>Profile</span></nav>
      </div>
      <figcaption><b>Routes</b>Each built route shows its shape, length, start type and whether it is public. Publish sits on private routes for creators; drivers see the request card instead.</figcaption>
    </figure>

    <!-- ROUTE BUILDER -->
    <figure class="shot">
      <div class="phone">
        <div class="map" style="position:absolute;inset:0">
          <svg><use href="#i-roads"/></svg>
          <svg viewBox="0 0 390 844" preserveAspectRatio="none">
            <path d="M60 470 C100 440 120 400 150 390 S200 360 210 330 S240 270 290 250 S330 210 340 180" stroke="#0e1b3d" stroke-width="6" fill="none" stroke-linecap="round"/>
            <path d="M138 384l14 14M214 318l14 10" stroke="#f7f9fc" stroke-width="4"/>
            <circle cx="60" cy="470" r="11" fill="#1fa64f" stroke="#f7f9fc" stroke-width="3"/><circle cx="150" cy="390" r="6" fill="#f7f9fc" stroke="#0e1b3d" stroke-width="3"/><circle cx="210" cy="330" r="6" fill="#f7f9fc" stroke="#0e1b3d" stroke-width="3"/><circle cx="290" cy="250" r="6" fill="#f7f9fc" stroke="#0e1b3d" stroke-width="3"/><circle cx="340" cy="180" r="11" fill="#0e1b3d" stroke="#f7f9fc" stroke-width="3"/>
          </svg>
          <span class="pin" style="left:60px;top:455px;background:var(--green-ink)">Start</span>
          <span class="fab" style="right:16px;top:110px"><svg class="i"><use href="#i-locate"/></svg></span>
          <span class="fab" style="right:16px;top:164px"><svg class="i"><use href="#i-undo"/></svg></span>
          <span class="fab" style="right:16px;top:218px"><svg class="i"><use href="#i-trash"/></svg></span>
        </div>
        <div class="sb" style="position:relative">9:41</div>
        <div class="bar" style="position:relative"><span class="ib" style="background:#f7f9fc;box-shadow:var(--lift)"><svg class="i"><use href="#i-close"/></svg></span><span class="title" style="background:#f7f9fc;border-radius:999px;padding:10px 14px;box-shadow:var(--lift);font-size:15px;flex:none">New route · tap to add the next point</span></div>
        <div class="sheet">
          <div class="grab"></div>
          <div style="display:flex;justify-content:space-between;align-items:baseline"><span class="t t-m">3.42 km</span><span class="sub">3 sectors · 21 minisectors</span></div>
          <div class="field" style="margin-top:12px"><label>Name</label><div class="input"><span class="ph">e.g. Brno Circuit, full lap</span></div></div>
          <div style="display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin-top:12px">
            <div class="seg"><span class="on">Standing</span><span>Rolling</span></div>
            <div style="display:flex;gap:8px;align-items:center;font-size:14px;font-weight:700">Lap <span class="switch"></span></div>
          </div>
          <p class="hint" style="margin-top:10px">Stop at the start, then a 3–10 s countdown. Moving more than 10 m early costs +5 s. White ticks show where each sector ends.</p>
          <button class="btn primary block" style="margin-top:12px">Save route</button>
        </div>
        <span class="sample">Sample data</span>
      </div>
      <figcaption><b>Build a route</b>Tap the map to place the start, then each point; the line snaps to roads. Undo and clear sit with locate on the map edge. The sheet holds the name, start type and Lap switch.</figcaption>
    </figure>

    <!-- ROUTE DETAIL -->

      <div class="phone">
        <span class="sample">Sample data</span>
        <div class="map" style="height:250px">
          <svg><use href="#i-roads"/></svg>
          <svg viewBox="0 0 390 250"><path d="M50 210 C90 180 80 150 140 140" stroke="#8b3fe0" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M140 140 S200 90 250 80" stroke="#1fa64f" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M250 80 S320 60 340 40" stroke="#f5cf19" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M134 132l12 14M244 72l10 14" stroke="#f7f9fc" stroke-width="4"/></svg>
          <div class="sb" style="position:relative">9:41</div>
          <div class="bar" style="position:relative"><span class="ib" style="background:#f7f9fc;box-shadow:var(--lift)"><svg class="i"><use href="#i-back"/></svg></span><span class="title"></span><span class="ib" style="background:#f7f9fc;box-shadow:var(--lift)"><svg class="i"><use href="#i-more"/></svg></span></div>
        </div>
        <div class="pad" style="padding-top:16px">
          <div style="display:flex;gap:6px"><span class="chip n">Official</span><span class="chip">Standing start</span><span class="chip">3.42 km</span></div>
          <h1 class="h1" style="margin-top:8px">Ecce Homo hill-climb</h1>
          <div class="ls lg" style="margin-top:12px"><b class="p"><span>S1 0:40.92</span></b><b class="p"><span>S2 0:51.33</span></b><b class="p"><span>S3 0:39.22</span></b></div>
          <div class="sub" style="margin-top:6px">Sector records, each by the fastest driver in that sector</div>
        </div>
        <div class="pad" style="padding-top:14px"><div class="seg"><span class="on">Leaderboard</span><span>Locals</span></div></div>
        <div class="pad" style="padding-top:10px"><div class="list">
          <div class="row"><span class="pos p1">1</span><span class="rd s c1">PR</span><div class="grow"><div class="name">petra_r</div></div><span class="t t-s ink-p">2:11.47</span></div>
          <div class="row"><span class="pos">2</span><span class="rd s c2">JK</span><div class="grow"><div class="name">jan.k</div></div><span class="t t-s">2:13.90</span></div>
          <div class="row" style="background:#eef1f7"><span class="pos">4</span><span class="rd s c6" style="--c:#c2410c">TK</span><div class="grow"><div class="name">You</div></div><span class="t t-s">2:14.83</span></div>
        </div></div>
        <div class="pad" style="padding-top:10px"><div class="list"><div class="row"><svg class="i"><use href="#i-clock"/></svg><div class="grow"><div class="name">My laps on this route</div><div class="sub">5 laps · theoretical best 2:13.91</div></div><svg class="i chev"><use href="#i-next"/></svg></div></div></div>
        <div style="position:absolute;left:0;right:0;bottom:0;padding:12px 16px 30px;background:linear-gradient(transparent,var(--body) 30%);display:flex;gap:8px">
          <button class="btn ghost" style="flex:none;width:52px;padding:0"><svg class="i"><use href="#i-home"/></svg></button>
          <button class="btn primary" style="flex:1">Drive this route</button>
        </div>
      </div>
      <figcaption><b>Route detail</b>The map draws each sector in its record colour. Sector records sit in one big stripe, then the leaderboard with your row highlighted. Drive is pinned at the bottom; the house sets it as your home course.</figcaption>
    </figure>

          <div class="row"><div class="grow"><div style="display:flex;gap:6px;align-items:center"><span class="t t-m">2:15.40</span></div><div class="sub" style="margin-top:4px">2 Nov · 14:18</div></div><div class="ls" style="width:96px"><b class="p"></b><b class="y"></b><b class="y"></b></div></div>
          <div class="row"><div class="grow"><div style="display:flex;gap:6px;align-items:center"><span class="t t-m">2:21.06</span><span class="chip r">+5 s</span></div><div class="sub" style="margin-top:4px">26 Oct · 15:04</div></div><div class="ls" style="width:96px"><b class="y"></b><b class="g"></b><b class="y"></b></div></div>
