
<section class="g-sec" id="drive">
  <h2>Drive</h2>
  <p>From the light paddock into the navy car. Once Start is pressed, every screen is navy with off-white numerals sized for a glance in a windscreen mount, and nothing needs a tap until the car has stopped.</p>
  <div class="shots">

    <!-- LAUNCHER -->
    <figure class="shot">
      <div class="phone">
        <div class="sb">9:41</div>
        <div class="pad" style="padding-top:18px"><h1 class="h1" style="font-size:32px;font-style:italic;text-transform:uppercase;font-weight:900">Where are you driving?</h1></div>
        <div class="pad" style="padding-top:16px">
          <article class="card on-panel" style="background:var(--navy);color:#f7f9fc;padding:16px;position:relative;overflow:hidden">
            <div class="livery thin" style="width:72px"><i></i><i></i><i></i></div>
            <div style="position:relative;max-width:260px">
              <div class="cap" style="color:var(--on-navy-2)">Home course</div>
              <div class="h2" style="margin-top:4px">Ecce Homo hill-climb</div>
              <div style="display:flex;gap:10px;align-items:baseline;margin-top:8px"><span class="t t-l">2:14.83</span><span class="sub">your best</span></div>
              <button class="btn inverse" style="margin-top:14px">Drive</button>
            </div>
          </article>
        </div>
        <div class="sec-h"><h3>Recently driven</h3></div>
        <div class="pad"><div class="list">
          <div class="row"><svg viewBox="0 0 44 36" style="width:44px;height:36px;flex:none"><path d="M8 28 L8 10 Q8 4 14 4 L32 4 Q38 4 36 10 L30 18 Q28 22 34 26 L35 30 L11 31 Q8 31 8 28Z" stroke="#0e1b3d" stroke-width="2.5" fill="none"/></svg><div class="grow"><div class="name">Autodrom Most, full lap</div><div class="sub">Public · last driven 26 Oct</div></div><svg class="i chev"><use href="#i-next"/></svg></div>
          <div class="row"><svg viewBox="0 0 44 36" style="width:44px;height:36px;flex:none"><path d="M6 20 Q6 4 18 6 Q26 8 27 16 Q28 24 36 22 Q42 20 40 30 L12 30 Q6 28 6 20Z" stroke="#0e1b3d" stroke-width="2.5" fill="none"/></svg><div class="grow"><div class="name">Club sprint, Saturday loop</div><div class="sub">Private · last driven 19 Oct</div></div><svg class="i chev"><use href="#i-next"/></svg></div>
        </div></div>
        <div class="pad" style="padding-top:14px"><button class="btn ghost block"><svg class="i sm"><use href="#i-search"/></svg>Find a route on the map</button></div>
        <span class="sample">Sample data</span>
        <nav class="tabs"><span class="tab"><svg class="i"><use href="#i-feed"/></svg>Feed</span><span class="tab"><svg class="i"><use href="#i-search"/></svg>Explore</span><span class="tab on"><span class="go">GO</span></span><span class="tab"><svg class="i"><use href="#i-routes"/></svg>Routes</span><span class="tab"><svg class="i"><use href="#i-user"/></svg>Profile</span></nav>
      </div>
      <figcaption><b>Drive tab</b>One question, the home course first, then recent routes. The GO roundel wears the purple ring while this tab is open.</figcaption>
    </figure>

    <!-- PRE-DRIVE -->
    <figure class="shot">
      <div class="phone">
        <div class="sb">9:41</div>
        <div class="bar"><span class="ib"><svg class="i"><use href="#i-back"/></svg></span><span class="title">Ecce Homo hill-climb</span><span class="chip" style="margin-right:8px"><svg class="i sm" style="width:12px;height:12px"><use href="#i-gps"/></svg>GPS good</span></div>
        <div class="sec-h" style="padding-top:4px"><h3>Race against</h3></div>
        <div class="pad"><div class="list">
          <div class="row"><svg class="i ink-p"><use href="#i-podium"/></svg><div class="grow"><div class="name">Route record</div><div class="sub">petra_r · 2:11.47</div></div><span style="width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--rule-2)"></span></div>
          <div class="row" style="background:#eef1f7"><svg class="i"><use href="#i-user"/></svg><div class="grow"><div class="name">Your best</div><div class="sub">2:14.83 · 2 Nov</div></div><span style="width:24px;height:24px;border-radius:50%;background:var(--navy);box-shadow:inset 0 0 0 6px #eef1f7, 0 0 0 2px var(--navy)"></span></div>
          <div class="row"><svg class="i"><use href="#i-clock"/></svg><div class="grow"><div class="name">Theoretical best</div><div class="sub">Your best time in each sector · 2:13.91</div></div><span style="width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--rule-2)"></span></div>
          <div class="row"><svg class="i"><use href="#i-close"/></svg><div class="grow"><div class="name">No reference</div><div class="sub">Just the clock</div></div><span style="width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--rule-2)"></span></div>
        </div></div>
        <div class="sec-h"><h3>Setup</h3></div>
        <div class="pad"><div class="list">
          <div class="row"><div class="grow"><div class="name">Countdown</div><div class="sub">Lights go out this long after Start</div></div><div class="stepper"><span class="ib"><svg class="i sm"><use href="#i-back"/></svg></span><b>5 s</b><span class="ib"><svg class="i sm"><use href="#i-next"/></svg></span></div></div>
          <div class="row"><div class="grow"><div class="name">Screen</div><div class="seg" style="margin-top:8px"><span class="on">Full HUD</span><span>Delta only</span></div></div></div>
          <div class="row"><svg class="i"><use href="#i-voice"/></svg><div class="grow"><div class="name">Voice callouts</div><div class="sub">“Sector 2, minus zero point four”</div></div><span class="switch on"></span></div>
        </div></div>
        <div style="position:absolute;left:0;right:0;bottom:0;padding:12px 16px 30px;background:linear-gradient(transparent,var(--body) 26%)"><button class="btn primary xl block">Start</button></div>
        <span class="sample">Sample data</span>
      </div>
      <figcaption><b>Before the drive</b>Pick who to race, set the countdown, screen and voice, then one big Start pinned at the thumb. Posted laps from other drivers appear in the same list.</figcaption>
    </figure>

    <!-- DRIVE TO START -->
    <figure class="shot">
      <div class="phone navy">
        <div class="sb">9:41</div>
        <div class="pad" style="display:flex;justify-content:space-between;align-items:center"><span class="chip" style="background:var(--navy-2);color:var(--on-navy-2)"><svg class="i sm" style="width:12px;height:12px"><use href="#i-gps"/></svg>GPS ±4 m</span><span class="sub">vs Your best</span></div>
        <div style="text-align:center;padding-top:70px">
          <div class="cap" style="color:var(--on-navy-2)">Drive to the start</div>
          <div class="t t-xxl" style="margin-top:12px">340<span style="font-size:40px"> m</span></div>
          <p class="sub" style="font-size:16px;max-width:280px;margin:16px auto 0">Approach the start line in the route's direction. Timing arms within 50 m.</p>
        </div>
        <div style="position:absolute;left:24px;right:24px;bottom:150px;display:flex;gap:8px;transform:skewX(var(--skew))"><i style="flex:1;height:10px;background:var(--navy-2);border-radius:3px"></i><i style="flex:1;height:10px;background:var(--navy-2);border-radius:3px"></i><i style="flex:1;height:10px;background:var(--navy-2);border-radius:3px"></i></div>
        <div class="pad" style="position:absolute;left:0;right:0;bottom:40px"><button class="btn ghost-inv block">Hold to exit</button></div>
      </div>
      <figcaption><b>Drive to the start</b>Only one number on screen: the distance to the line. The empty stripe waits for its first sector.</figcaption>
    </figure>

    <!-- LIGHTS -->
    <figure class="shot">
      <div class="phone navy">
        <div class="sb">9:41</div>
        <div class="pad" style="display:flex;justify-content:space-between;align-items:center"><span class="chip" style="background:var(--navy-2);color:var(--on-navy-2)"><svg class="i sm" style="width:12px;height:12px"><use href="#i-gps"/></svg>GPS ±3 m</span><span class="sub">Armed · standing start</span></div>
        <div style="padding-top:120px;display:grid;gap:30px;justify-items:center">
          <div class="lights"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></div>
          <div class="t t-xxl">3</div>
          <p class="sub" style="font-size:16px;text-align:center;max-width:260px">Timing starts when you move off after GO. Moving more than 10 m early adds 5 s.</p>
        </div>
        <div class="pad" style="position:absolute;left:0;right:0;bottom:40px"><button class="btn ghost-inv block">Hold to stop</button></div>
      </div>
      <figcaption><b>Countdown lights</b>Five lights fill, then go out at GO, with beeps. Before this, a Start button appears once the car has been still at the line for 2 seconds.</figcaption>
    </figure>

    <!-- HUD -->
    <figure class="shot">
      <div class="phone navy">
        <div class="sb">9:41</div>
        <div class="pad" style="display:flex;justify-content:space-between;align-items:center"><span class="chip" style="background:var(--navy-2);color:var(--on-navy-2)"><svg class="i sm" style="width:12px;height:12px"><use href="#i-gps"/></svg>GPS ±3 m</span><span class="t t-s">118<span class="sub" style="font-style:normal;font-weight:600;font-size:13px"> km/h</span></span></div>
        <div style="text-align:center;padding-top:26px">
          <div class="t t-l" style="color:var(--on-navy-2)">1:38.4</div>
          <div class="t hi-g" style="font-size:136px;margin-top:6px">−0.41</div>
          <div class="sub" style="font-size:15px;margin-top:2px">vs Your best · faster</div>
        </div>
        <div style="display:flex;gap:10px;height:180px;padding:28px 44px 0">
          <div class="hud-band p"><div><div class="cap">S1</div><div class="t t-m">−0.28</div></div></div>
          <div class="hud-band g"><div><div class="cap">S2</div><div class="t t-m">−0.20</div></div></div>
          <div class="hud-band live"><div><div class="cap">S3</div><div class="t t-m">S3.4</div></div></div>
        </div>
        <div class="pad" style="padding-top:18px"><div class="minis"><i class="p"></i><i class="g"></i><i class="p"></i><i class="g"></i><i class="g"></i><i class="y"></i><i class="g"></i><i class="g"></i><i class="y"></i><i class="g"></i><i class="g"></i><i class="p"></i><i class="g"></i><i class="y"></i><i class="g"></i><i class="g"></i><i class="now"></i><i></i><i></i><i></i><i></i></div></div>
        <div class="pad" style="position:absolute;left:0;right:0;bottom:40px"><button class="btn ghost-inv block">Hold to stop</button></div>
        <span class="sample">Sample data</span>
      </div>
      <figcaption><b>Drive HUD</b>The gap to the reference is the biggest thing on screen. The lap's own stripe builds below it: finished sectors fill with their colour and gap, the live one is outlined with the minisector the car is in. This is a stage, so the button reads Hold to stop; on a lap route it reads Hold to finish session.</figcaption>
    </figure>

    <!-- DELTA ONLY, SIDEWAYS -->
    <figure class="shot wide">
      <div class="phone land" style="background:var(--green);color:var(--navy)">
        <div style="position:absolute;inset:0;display:flex;flex-direction:column;padding:16px 28px 18px">
          <header style="display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:700">
            <span>Ecce Homo hill-climb</span>
            <span style="display:flex;align-items:center;gap:6px"><svg class="i sm"><use href="#i-gps"/></svg>GPS ±3 m</span>
          </header>
          <section style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px">
            <div class="t" style="font-size:212px;line-height:.85;color:var(--card)">−0.41</div>
            <div style="font-size:19px;font-weight:600">vs Your best</div>
          </section>
          <footer style="display:flex;justify-content:space-between;align-items:center">
            <span style="display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600"><svg class="i sm"><use href="#i-rotate"/></svg>Turn upright for full HUD</span>
            <button class="btn sm" style="background:transparent;color:var(--navy);box-shadow:inset 0 0 0 2px var(--navy)">Hold to exit</button>
          </footer>
        </div>
        <span class="sample" style="background:var(--navy);color:var(--on-navy);border-color:var(--navy)">Sample data</span>
      </div>
      <figcaption><b>Delta only (phone sideways)</b>As in today's app: the whole screen is the flag colour of the last minisector, with the gap in huge off-white numerals and nothing beside it. Route and GPS sit along the top; turn-upright hint and a small Hold to exit along the bottom. On purple the ink turns off-white.</figcaption>
    </figure>

    <!-- JUMP START -->
    <figure class="shot">
      <div class="phone navy">
        <div style="background:var(--red);color:#f7f9fc;padding:52px 16px 16px;display:flex;gap:12px;align-items:center">
          <svg class="i" style="width:30px;height:30px"><use href="#i-flag"/></svg>
          <div><div style="font-weight:900;font-style:italic;text-transform:uppercase;font-size:22px;line-height:1">Jump start · +5 s</div><div style="font-size:14px;margin-top:4px">Moved 14 m before GO. Timed from GO.</div></div>
        </div>
        <div style="text-align:center;padding-top:40px">
          <div class="t t-l" style="color:var(--on-navy-2)">0:12.6</div>
          <div class="t hi-y" style="font-size:136px;margin-top:6px">+4.12</div>
          <div class="sub" style="font-size:15px">vs Your best · penalty included</div>
        </div>
        <div style="display:flex;gap:10px;height:150px;padding:28px 40px 0">
          <div class="hud-band live"><div><div class="cap">S1</div><div class="t t-m">S1.3</div></div></div>
          <div class="hud-band"><div><div class="cap">S2</div></div></div>
          <div class="hud-band"><div><div class="cap">S3</div></div></div>
        </div>
        <div class="pad" style="position:absolute;left:0;right:0;bottom:40px"><button class="btn ghost-inv block">Hold to stop</button></div>
        <span class="sample">Sample data</span>
      </div>
      <figcaption><b>Jump start</b>The red banner is the only red in the drive. The penalty is in the numbers and in words, never hidden.</figcaption>
    </figure>

    <!-- PARTIAL RUN -->
    <figure class="shot">
      <div class="phone navy">
        <div class="sb">9:41</div>
        <div style="text-align:center;padding-top:40px">
          <div class="cap" style="color:var(--on-navy-2)">GPS lost before the finish · Ecce Homo</div>
          <div class="t" style="font-size:96px;margin-top:10px">1:31.88</div>
          <div class="sub" style="font-size:15px;margin-top:6px">2 of 3 sectors timed</div>
        </div>
        <div style="display:flex;gap:10px;height:120px;padding:30px 36px 0">
          <div class="hud-band p"><div><div class="cap">S1</div><div class="t t-s">−0.28</div></div></div>
          <div class="hud-band g"><div><div class="cap">S2</div><div class="t t-s">−0.20</div></div></div>
          <div class="hud-band" style="background:transparent;box-shadow:inset 0 0 0 2px var(--navy-3)"><div><div class="cap">S3</div><div style="font-size:12px">not reached</div></div></div>
        </div>
        <div class="pad" style="padding-top:34px"><div style="background:var(--navy-2);border-radius:14px;padding:14px 16px;font-size:15px;color:var(--on-navy-2)">The GPS signal dropped out 1.1 km from the finish. Keep the 2.32 km you drove to view it and compare it. A partial run can't be posted or set a best.</div></div>
        <div class="pad" style="position:absolute;left:0;right:0;bottom:40px;display:grid;gap:12px">
          <div style="text-align:center;font-size:20px;font-weight:800">Keep this run?</div>
          <div class="btns"><button class="btn ghost-inv" style="flex:1">Discard</button><button class="btn inverse" style="flex:2">Keep</button></div>
        </div>
        <span class="sample">Sample data</span>
      </div>
      <figcaption><b>Partial run</b>Only when GPS drops out before the finish line. A finished stage goes straight to its run summary; on a lap route, finished laps keep the session going until Hold to finish session.</figcaption>
    </figure>

  </div>
</section>
