
<section class="g-sec" id="review">
  <h2>Review</h2>
  <p>After the drive: a stage gets one result, a lap route gets its session of laps; then the post, and the lap read against the lap it raced. A finished lap gets the whole first screen; the detail is one scroll or one tab away.</p>
