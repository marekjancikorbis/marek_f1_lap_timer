
<section class="g-sec" id="account">
  <h2>Account</h2>
  <p>Settings, moderation and the one screen nobody wants to see. Same light bodywork, same row grammar, so these pages need no explanation.</p>
  <div class="shots">

    <figure class="shot">
      <div class="phone">

        <div class="pad"><div class="list">

          <div class="row"><div class="grow"><div class="sub">Display name</div><div class="name">Tomáš Kolář</div></div><svg class="i chev"><use href="#i-pen"/></svg></div>
          <div class="row"><div class="grow"><div class="sub" style="margin-bottom:8px">Avatar colour (without a photo)</div><div style="display:flex;gap:10px">
            <span class="rd s c1" style="box-shadow:inset 0 0 0 2px #f7f9fc,0 0 0 2px var(--navy)"></span><span class="rd s c2"></span><span class="rd s c3"></span><span class="rd s c4"></span><span class="rd s c5"></span><span class="rd s c6"></span></div></div></div>
        </div></div>
        <div class="sec-h"><h3>Driving</h3></div>
        <div class="pad"><div class="list">
          <div class="row"><div class="grow"><div class="name">Countdown</div><div class="sub">Lights go out this long after Start</div></div><div class="stepper"><span class="ib"><svg class="i sm"><use href="#i-back"/></svg></span><b>5 s</b><span class="ib"><svg class="i sm"><use href="#i-next"/></svg></span></div></div>
          <div class="row"><div class="grow"><div class="name">GPS logs</div><div class="sub">Your last 5 real drives, kept on this phone</div></div><span class="chip">3</span><svg class="i chev"><use href="#i-next"/></svg></div>

    </figure>
