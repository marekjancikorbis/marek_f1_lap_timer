<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Purple Sector · {{name}}</title>
<script>
  // Only Chromium can feed an SVG filter to backdrop-filter; everyone else gets frosted glass.
  if (window.chrome && CSS.supports('backdrop-filter', 'url(#x)')) document.documentElement.classList.add('lens');
</script>
<style>
/* Glass: the real map is the content layer. Glass is only the floating control layer above it:
   bars, buttons, sheets. Text sits on tinted glass or solid, never on clear glass. */
:root {
  {{palette}}
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", sans-serif;
  --spring: cubic-bezier(.3, 1.5, .5, 1);
}
* { box-sizing: border-box; margin: 0; padding: 0 }
html, body { background: var(--page); color: var(--ink); font: 15px/1.4 var(--font) }
body { padding-block: 24px 48px }
header.top { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
header.top a { color: var(--ink-2); text-decoration: none; font-size: 14px }
header.top h1 { font-size: 28px; letter-spacing: -.02em; font-weight: 700 }
.sw { display: flex; gap: 6px } .sw i { width: 18px; height: 18px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(255,255,255,.2) }
.wall { display: flex; gap: 36px; overflow-x: auto; padding: 24px max(16px, env(safe-area-inset-left, 0px)) 12px; scroll-snap-type: x proximity }
figure { flex: none; scroll-snap-align: center }
figcaption { margin-top: 14px; font-size: 13px; color: var(--ink-2); text-align: center }

/* ---------- phone + content layer ---------- */
.ph { width: 390px; height: 844px; border-radius: 48px; overflow: hidden; position: relative; isolation: isolate; background: var(--night);
  box-shadow: 0 0 0 9px var(--ring), 0 0 0 10px rgba(255,255,255,.08), 0 40px 80px -30px rgba(0, 0, 0, .8); font-variant-numeric: tabular-nums }
.map { position: absolute; inset: 0; isolation: isolate; z-index: -3 }
.map::before { content: ""; position: absolute; inset: 0; background: var(--map-img) center / cover; filter: var(--map-filter) }
.map::after { content: ""; position: absolute; inset: 0; background: var(--map-tint); mix-blend-mode: var(--map-blend) }
.route { position: absolute; inset: 0; width: 390px; height: 844px; z-index: -2; fill: none; stroke-linecap: round; stroke-linejoin: round }
.sb { height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 6px 32px 0 36px; font-size: 15px; font-weight: 600 }
.sb::after { content: ""; width: 66px; height: 12px; border-radius: 4px; background: linear-gradient(90deg, currentColor 0 18px, transparent 18px 23px, currentColor 23px 42px, transparent 42px 47px, currentColor 47px) }

/* ---------- liquid glass ---------- */
/* --lens is a per-element SVG filter built by the script at the bottom: it bends the backdrop inside a rim
   band shaped like a convex edge, so the bending follows the element's real size and corners. */
@property --lit { syntax: '<number>'; inherits: true; initial-value: 0 }
.glass { position: relative; overflow: hidden; isolation: isolate; background: var(--clear); --light: 300deg;
  -webkit-backdrop-filter: blur(3px) var(--glass-fx); backdrop-filter: blur(3px) var(--glass-fx);
  box-shadow: inset 0 0 18px rgba(255,255,255,.05), 0 10px 30px -10px rgba(0,0,0,.5);
  transition: transform .45s var(--spring), --lit .6s ease-out }
html.lens .glass { -webkit-backdrop-filter: var(--lens) blur(.4px) var(--glass-fx); backdrop-filter: var(--lens) blur(.4px) var(--glass-fx) }
/* inner sheen, plus light spreading from the touch point while pressed */
.glass::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: -1;
  background:
    radial-gradient(circle at var(--px, 50%) var(--py, 50%), rgba(255,255,255, calc(.32 * var(--lit))), transparent 65%),
    radial-gradient(120% 60% at 25% -10%, rgba(255,255,255,.16), transparent 55%) }
/* rim: a thin ring lit where the light source is (moves with the pointer, standing in for tilting the phone) */
.glass::after { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.3px; pointer-events: none;
  background: conic-gradient(from var(--light), rgba(255,255,255,.95), rgba(255,255,255,.12) 16%, rgba(255,255,255,.06) 40%, rgba(255,255,255,.5) 50%, rgba(255,255,255,.08) 62%, rgba(255,255,255,.12) 84%, rgba(255,255,255,.95));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude }
/* regular glass: blurs and evens out the luminance behind it, thick enough to carry text */
/* sheets off Home: about 60% of the Home card tint and a light blur, so the map stays readable through them */
.glass.sheet { background: color-mix(in srgb, var(--sheet) 60%, transparent); -webkit-backdrop-filter: blur(4px) saturate(1.5); backdrop-filter: blur(4px) saturate(1.5) }
html.lens .glass.sheet { -webkit-backdrop-filter: var(--lens) blur(2px) saturate(1.5); backdrop-filter: var(--lens) blur(2px) saturate(1.5) }
.glass.tint-p { background: color-mix(in srgb, var(--s-p) 85%, transparent) }
.glass.tint-g { background: color-mix(in srgb, var(--s-g) 82%, transparent) }
/* under the finger glass swells from where it is pressed and lights up from that point */
.glass.pressed { transform: scale(1.05); --lit: 1; transition: transform .25s var(--spring), --lit .12s ease-out; transform-origin: var(--px, 50%) var(--py, 50%) }
/* scroll edge effect: content fades and blurs where it runs under the floating controls */
.edge { position: absolute; left: 0; right: 0; top: 0; height: 130px; z-index: -1; pointer-events: none;
  background: linear-gradient(color-mix(in srgb, var(--night) 60%, transparent), transparent);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  -webkit-mask-image: linear-gradient(#000 30%, transparent); mask-image: linear-gradient(#000 30%, transparent) }
@media (prefers-reduced-transparency: reduce) {
  .glass, html.lens .glass, html.lens .glass.sheet, html.lens .glass.lift { -webkit-backdrop-filter: none; backdrop-filter: none; background: var(--night) }
  .edge { -webkit-backdrop-filter: none; backdrop-filter: none; background: var(--night) }
}
@media (prefers-reduced-motion: reduce) { .glass, .glass.pressed { transform: none } }

button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer }
:focus-visible { outline: 2px solid var(--main-hi); outline-offset: 3px }
.ib { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center }
svg.i { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round }
.solid { height: 52px; border-radius: 26px; background: var(--main); color: var(--on-main); font-weight: 600; font-size: 17px; display: flex; align-items: center; justify-content: center; transition: transform .12s ease-out; width: 100% }
.solid.quiet { background: color-mix(in srgb, var(--ink) 10%, transparent); color: var(--ink) }
.solid:active { transform: scale(.97) }
.chip { height: 36px; padding: 0 14px; border-radius: 18px; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 7px }

.t { font-weight: 700; letter-spacing: -.035em; line-height: .95 }
.lbl { font-size: 13px; font-weight: 600; color: var(--ink-2) }
.acc { color: var(--accent) }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none }
.p { background: var(--s-p) } .g { background: var(--s-g) } .y { background: var(--s-y) }
.st { display: flex; gap: 3px } .st i { width: 22px; height: 5px; border-radius: 3px }

/* sheet: inset 8 px from a 48 px screen corner, so 40 px keeps the corners concentric */
.sheet-b { position: absolute; left: 8px; right: 8px; bottom: 8px; border-radius: 40px; padding: 10px 20px 20px }
.grab { width: 38px; height: 5px; border-radius: 3px; background: color-mix(in srgb, var(--ink) 30%, transparent); margin: 0 auto 14px }
.rows > div { display: grid; grid-template-columns: 36px 1fr auto; gap: 12px; align-items: center; padding: 10px 0 }
.rows > div + div { border-top: 1px solid color-mix(in srgb, var(--ink) 10%, transparent) }
.av { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #10131c }

/* tab bar: tabs in one capsule, Drive in its own circle, like the separate search button */
.tabbar { position: absolute; left: 20px; right: 20px; bottom: 24px; display: flex; gap: 10px; align-items: center }
.tabs { flex: 1; height: 62px; border-radius: 31px; display: grid; grid-template-columns: repeat(4, 1fr); padding: 4px }
.tab { display: grid; place-items: center; border-radius: 27px; color: var(--ink-2) }
.tab.on { color: var(--main-hi); background: color-mix(in srgb, var(--ink) 10%, transparent) }
.go { width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center; color: var(--on-main); background: color-mix(in srgb, var(--main) 78%, transparent) }
.ndot { position: relative } .ndot::after { content: ""; position: absolute; top: 2px; right: 1px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent) }
/* ---------- home: crisp gradient blobs whose outline is redrawn every frame from layered waves ---------- */
.blob { position: absolute; inset: 0; width: 390px; height: 844px; z-index: -3 }
/* thin tinted glass: enough tint for text, little enough blur that the bent shape shows through */
.glass.lift { background: var(--sheet); -webkit-backdrop-filter: blur(4px) var(--glass-fx); backdrop-filter: blur(4px) var(--glass-fx) }
html.lens .glass.lift { -webkit-backdrop-filter: var(--lens) blur(2px) var(--glass-fx); backdrop-filter: var(--lens) blur(2px) var(--glass-fx) }
.pill { height: 72px; border-radius: 36px; display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; padding: 0 14px 0 16px }
.pill .av { width: 40px; height: 40px }
@media (prefers-reduced-transparency: reduce) { .glass.lift, html.lens .glass.lift { -webkit-backdrop-filter: none; backdrop-filter: none; background: var(--night) } }
</style>
</head>

      <linearGradient id="blob-g2" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--blob-b)"/><stop offset="1" stop-color="var(--blob-a)" stop-opacity=".35"/></linearGradient>

<script>
// Home blobs: each outline is 10 points whose radius is a sum of out-of-phase waves, joined by a closed
// Catmull-Rom curve, so the shape never repeats a simple ellipse. Reduced motion draws one still frame.
(() => {
  const blobs = [
    { cx: 200, cy: 330, r: 150, seed: 0 },
    { cx: 120, cy: 600, r: 105, seed: 2.1 },
    { cx: 300, cy: 520, r: 70, seed: 4.3 },
  ];
  const N = 10, TAU = Math.PI * 2;
  const paths = [...document.querySelectorAll('[data-blob]')];
  function outline(b, t) {
    const s = b.seed, pts = [];
    const cx = b.cx + 34 * Math.sin(t * 0.37 + s) + 14 * Math.sin(t * 0.83 + s * 3);
    const cy = b.cy + 40 * Math.cos(t * 0.29 + s * 1.7) + 12 * Math.sin(t * 0.71 + s);
    const spin = t * 0.12 + s;
    for (let i = 0; i < N; i++) {
      const a = (i / N) * TAU + spin;
      const k = 1
        + 0.26 * Math.sin(2 * a + t * 0.9 + s)
        + 0.17 * Math.sin(3 * a - t * 1.3 + s * 2)
        + 0.10 * Math.sin(5 * a + t * 2.1 + s * 3);
      pts.push([cx + Math.cos(a) * b.r * k, cy + Math.sin(a) * b.r * k]);
    }
    let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
    for (let i = 0; i < N; i++) {
      const p0 = pts[(i + N - 1) % N], p1 = pts[i], p2 = pts[(i + 1) % N], p3 = pts[(i + 2) % N];
      d += `C${(p1[0] + (p2[0] - p0[0]) / 6).toFixed(1)} ${(p1[1] + (p2[1] - p0[1]) / 6).toFixed(1)} `
         + `${(p2[0] - (p3[0] - p1[0]) / 6).toFixed(1)} ${(p2[1] - (p3[1] - p1[1]) / 6).toFixed(1)} `
         + `${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
    }
    return d + 'Z';
  }
  const draw = (t) => paths.forEach((p, i) => p.setAttribute('d', outline(blobs[i], t)));
  draw(0);
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const start = performance.now();
  const tick = (now) => { draw((now - start) / 1000); requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
})();
</script>
