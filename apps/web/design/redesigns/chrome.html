<style>
/* Chrome: a timing tower. Times in polished chrome, labels and progress in pixels, lime is the only thing you press. */
:root {
  --cobalt: #090f22;     /* cobalt black */
  --panel: #111a37;
  --panel-2: #1b2650;
  --lav: #b9a6ff;        /* lavender violet: structure, selection */
  --lime: #c8f53a;       /* tropical lime: action */
  --ink: #eef0fb;
  --ink-2: #a3abcc;
  --s-p: #9b5cff; --s-g: #2fe6a0; --s-y: #ffd43b;   /* green shifted to mint so it never reads as the lime action */
  --display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --pix: "Silkscreen", "Courier New", monospace;
  --body: "Chakra Petch", system-ui, sans-serif;
  --px: polygon(0 8px, 4px 8px, 4px 4px, 8px 4px, 8px 0, calc(100% - 8px) 0, calc(100% - 8px) 4px, calc(100% - 4px) 4px, calc(100% - 4px) 8px, 100% 8px, 100% calc(100% - 8px), calc(100% - 4px) calc(100% - 8px), calc(100% - 4px) calc(100% - 4px), calc(100% - 8px) calc(100% - 4px), calc(100% - 8px) 100%, 8px 100%, 8px calc(100% - 4px), 4px calc(100% - 4px), 4px calc(100% - 8px), 0 calc(100% - 8px));
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0 }
html, body { background: #060a18; color: var(--ink); font: 500 15px/1.4 var(--body) }
body { padding-block: 24px 48px }
header.top { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
header.top a { color: var(--ink-2); text-decoration: none; font-size: 14px }
header.top h1 { font: 800 28px var(--display) }
.sw { display: flex; gap: 6px } .sw i { width: 18px; height: 18px; clip-path: var(--px); }
.wall { display: flex; gap: 36px; overflow-x: auto; padding: 24px max(16px, env(safe-area-inset-left, 0px)) 12px; scroll-snap-type: x proximity }
figure { flex: none; scroll-snap-align: center }
figcaption { margin-top: 14px; font: 12px var(--pix); color: var(--ink-2); text-align: center }

.ph { width: 390px; height: 844px; border-radius: 46px; overflow: hidden; position: relative; background:
  linear-gradient(rgba(185,166,255,.045) 1px, transparent 1px) 0 0 / 100% 4px, var(--cobalt);
  box-shadow: 0 0 0 9px #1a1f33, 0 40px 80px -30px rgba(0, 0, 0, .8); font-variant-numeric: tabular-nums }
.sb { height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 6px 32px 0 36px; font-size: 15px; font-weight: 600 }
.sb::after { content: ""; width: 66px; height: 12px; background: linear-gradient(90deg, currentColor 0 18px, transparent 18px 23px, currentColor 23px 42px, transparent 42px 47px, currentColor 47px) }
.pg { padding: 0 18px }

/* chrome type: a horizon line across the middle of the glyphs */
.chrome { font-family: var(--display); font-weight: 800; letter-spacing: -.03em; line-height: .95;
  background: linear-gradient(180deg, #f6f7ff 0%, #d3d7ea 36%, #59618a 50%, #e4e7f8 58%, #a6adcc 82%, #f0f2ff 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent }
.chrome.mint { background-image: linear-gradient(180deg, #e9fff6 0%, #8ff5cd 36%, #0f8a5c 50%, #b8ffe2 58%, #2fe6a0 82%, #e0fff2 100%) }
.chrome.lav { background-image: linear-gradient(180deg, #f5f1ff 0%, #d6caff 36%, #6248c9 50%, #e5ddff 58%, #b9a6ff 82%, #f5f1ff 100%) }
.px { font-family: var(--pix); font-size: 11px; letter-spacing: .02em; color: var(--ink-2); text-transform: uppercase }
.blk { clip-path: var(--px); background: var(--panel) }
.p { background: var(--s-p) } .g { background: var(--s-g) } .y { background: var(--s-y) }
.st { display: flex; gap: 3px } .st i { width: 14px; height: 8px }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer }
.btn { height: 54px; padding: 0 24px; clip-path: var(--px); background: var(--lime); color: var(--cobalt); font: 15px var(--pix); display: flex; align-items: center; justify-content: center; gap: 10px; transition: transform .1s steps(2) }
.btn.dark { background: var(--panel-2); color: var(--ink) }
.btn:active, .tab:active { transform: translateY(2px) }
:focus-visible { outline: 2px dashed var(--lime); outline-offset: 3px }
.tower > div { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; height: 52px; padding-right: 14px; margin-top: 4px }
.pos { height: 100%; display: grid; place-items: center; font: 13px var(--pix); background: var(--panel-2); color: var(--ink) }
.av { width: 36px; height: 36px; clip-path: var(--px); display: grid; place-items: center; font: 12px var(--pix); color: var(--cobalt) }
.tabs { position: absolute; left: 14px; right: 14px; bottom: 22px; height: 62px; display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; clip-path: var(--px); background: var(--panel) }
.tab { display: grid; justify-items: center; gap: 6px; color: var(--ink-2); font: 9px var(--pix) }
.tab::after { content: ""; width: 6px; height: 6px; background: transparent }
.tab.on { color: var(--ink) } .tab.on::after { background: var(--lav) }
.tab.go { width: 52px; height: 44px; margin: auto; clip-path: var(--px); background: var(--lime); color: var(--cobalt); place-items: center } .tab.go::after { display: none }
svg.i { width: 22px; height: 22px; fill: currentColor; shape-rendering: crispEdges }
.mini { display: grid; grid-template-columns: repeat(24, 1fr); gap: 3px } .mini i { aspect-ratio: 1; background: var(--panel-2) }
.mini i.now { background: var(--ink) }
</style>
</head>
