<style>
/* Pop: chunky white cards on open sky, swipe sideways through laps, achievements arrive as stickers, one pink button to drive. */
:root {
  --sky: #8fd3f7;        /* sky blue: ground */
  --sky-2: #b9e4fb;
  --white: #fcfeff;      /* main surface, never pure white */
  --pink: #f2307d;       /* hot pink: drive, records, stickers */
  --ink: #0c2a48;
  --ink-2: #36506a;
  --s-p: #8b3fe0; --s-g: #17a04a; --s-y: #f5c518;
  --font: "Bricolage Grotesque", system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0 }
html, body { background: #7cc7ee; color: var(--ink); font: 500 15px/1.4 var(--font) }
body { padding-block: 24px 48px }
header.top { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
header.top a { color: var(--ink); text-decoration: none; font-size: 14px }
header.top h1 { font-size: 32px; font-weight: 800; letter-spacing: -.03em }
.sw { display: flex; gap: 6px } .sw i { width: 18px; height: 18px; border-radius: 50%; box-shadow: inset 0 0 0 2px rgba(12,42,72,.15) }
.wall { display: flex; gap: 36px; overflow-x: auto; padding: 24px max(16px, env(safe-area-inset-left, 0px)) 12px; scroll-snap-type: x proximity }
figure { flex: none; scroll-snap-align: center }
figcaption { margin-top: 14px; font-size: 14px; font-weight: 700; text-align: center }

.ph { width: 390px; height: 844px; border-radius: 48px; overflow: hidden; position: relative; background: var(--sky);
  box-shadow: 0 0 0 9px var(--ink), 0 40px 80px -30px rgba(12, 42, 72, .6); font-variant-numeric: tabular-nums }
.ph.w { background: var(--white) }
.sb { height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 6px 32px 0 36px; font-size: 15px; font-weight: 700 }
.sb::after { content: ""; width: 66px; height: 12px; border-radius: 4px; background: linear-gradient(90deg, currentColor 0 18px, transparent 18px 23px, currentColor 23px 42px, transparent 42px 47px, currentColor 47px) }
.pg { padding: 0 16px }
.cd { background: var(--white); border-radius: 32px; padding: 20px; position: relative; box-shadow: 0 2px 0 rgba(12,42,72,.08), 0 18px 30px -22px rgba(12,42,72,.45) }
.t { font-weight: 800; font-stretch: 86%; letter-spacing: -.012em; line-height: .9; font-variation-settings: "opsz" 96 }
.sm { font-size: 14px; color: var(--ink-2); font-weight: 600 }
.stk { position: absolute; padding: 8px 14px; border-radius: 14px; background: var(--pink); color: var(--white); font-weight: 800; font-size: 15px; transform: rotate(-8deg); box-shadow: 0 3px 0 rgba(12,42,72,.25) }
.p { background: var(--s-p) } .g { background: var(--s-g) } .y { background: var(--s-y) }
.st { display: flex; gap: 5px } .st i { flex: 1; height: 12px; border-radius: 6px }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer }
.btn { height: 56px; padding: 0 26px; border-radius: 28px; font-weight: 800; font-size: 18px; display: inline-flex; align-items: center; justify-content: center; transition: transform .14s cubic-bezier(.3,1.6,.6,1) }
.btn.pk { background: var(--pink); color: var(--white); box-shadow: 0 4px 0 #c21f63 }
.btn.ink { background: var(--ink); color: var(--white) }
.btn.wh { background: var(--white); color: var(--ink); box-shadow: 0 4px 0 rgba(12,42,72,.15) }
.btn:active, .fab:active, .ib:active { transform: scale(.94) }
.ib { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--white); transition: transform .14s ease-out }
svg.i { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round }
:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px }
.av { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; flex: none }
.tabs { position: absolute; left: 16px; right: 16px; bottom: 22px; height: 72px; border-radius: 36px; background: var(--ink); display: grid; grid-template-columns: 1fr 1fr 96px 1fr 1fr; align-items: center; color: rgba(252,254,255,.65) }
.tabs > span { display: grid; place-items: center }
.tabs .on { color: var(--white) }
.fab { width: 86px; height: 86px; margin: -34px auto 0; border-radius: 50%; background: var(--pink); color: var(--white); display: grid; place-items: center; font-weight: 800; font-size: 17px; box-shadow: 0 0 0 6px var(--sky), 0 5px 0 6px var(--sky); transition: transform .14s cubic-bezier(.3,1.6,.6,1) }
.peek { display: flex; gap: 12px; overflow: hidden; padding: 0 16px }
.peek .cd { flex: none; width: 250px; padding: 16px }
.ring { width: 28px; height: 28px; border-radius: 50%; box-shadow: inset 0 0 0 3px rgba(12,42,72,.2) }
.ring.on { box-shadow: inset 0 0 0 9px var(--pink) }
</style>
</head>
