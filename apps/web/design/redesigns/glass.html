<style>
/* Glass: the real map is the content layer. Glass is only the floating control layer above it:
   bars, buttons, sheets. Text sits on tinted glass or solid, never on clear glass. */
:root {
  --page: #08090b; --ring: #16181c; --night: #0c0d10; --main: #e8ebf0; --main-hi: #f4f6f9; --on-main: #111318; --accent: #a9b4c8; --ink: #f1f3f6; --ink-2: rgba(241, 243, 246, .72); --sheet: rgba(18, 20, 24, .58); --clear: rgba(255, 255, 255, .05); --glass-fx: saturate(1.2) brightness(1.08); --map-filter: grayscale(1) brightness(1.15) contrast(1.1); --map-tint: transparent; --map-blend: normal; --blob-a: #6f7a90; --blob-b: #343a47; --ribbon-a: #c9ced8; --ribbon-b: #4a5162; --s-p: #a970ff; --s-g: #3be07a; --s-y: #ffd43b;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", sans-serif;
  --spring: cubic-bezier(.3, 1.5, .5, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0 }
html, body { background: var(--page); color: var(--ink); font: 15px/1.4 var(--font) }
body { padding-block: 24px 48px }
header.top { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
header.top a { color: var(--ink-2); text-decoration: none; font-size: 14px }
header.top h1 { font-size: 28px; letter-spacing: -.02em; font-weight: 700 }
.sw { display: flex; gap: 6px } .sw i { width: 18px; height: 18px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(255,255,255,.2) }
.wall { display: flex; gap: 36px; overflow-x: auto; padding: 24px max(16px, env(safe-area-inset-left, 0px)) 12px; scroll-snap-type: x proximity }
figure { flex: none; scroll-snap-align: center }
figcaption { margin-top: 14px; font-size: 13px; color: var(--ink-2); text-align: center }

/* ---------- phone + content layer ---------- */
.ph { width: 390px; height: 844px; border-radius: 48px; overflow: hidden; position: relative; isolation: isolate; background: var(--night);
  box-shadow: 0 0 0 9px var(--ring), 0 0 0 10px rgba(255,255,255,.08), 0 40px 80px -30px rgba(0, 0, 0, .8); font-variant-numeric: tabular-nums }
.map { position: absolute; inset: 0; isolation: isolate; z-index: -3 }
.map::before { content: ""; position: absolute; inset: 0; background: var(--map-img) center / cover; filter: var(--map-filter) }
.map::after { content: ""; position: absolute; inset: 0; background: var(--map-tint); mix-blend-mode: var(--map-blend) }
.route { position: absolute; inset: 0; width: 390px; height: 844px; z-index: -2; fill: none; stroke-linecap: round; stroke-linejoin: round }
.sb { height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 6px 32px 0 36px; font-size: 15px; font-weight: 600 }
.sb::after { content: ""; width: 66px; height: 12px; border-radius: 4px; background: linear-gradient(90deg, currentColor 0 18px, transparent 18px 23px, currentColor 23px 42px, transparent 42px 47px, currentColor 47px) }

/* ---------- liquid glass ---------- */
.glass { position: relative; overflow: hidden; isolation: isolate; background: var(--clear);
  -webkit-backdrop-filter: blur(10px) var(--glass-fx); backdrop-filter: blur(10px) var(--glass-fx);
  box-shadow:
    inset 1.5px 1.5px 0 -.5px rgba(255,255,255,.55),    /* light catching the top-left rim */
    inset -1px -1px 0 -.5px rgba(255,255,255,.22),      /* the far rim, dimmer */
    inset 0 0 0 .5px rgba(255,255,255,.18),
    inset 0 0 18px rgba(255,255,255,.06),
    0 10px 30px -10px rgba(0,0,0,.55);
  transition: transform .35s var(--spring), filter .2s ease-out }
.glass::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: -1;
  background: radial-gradient(120% 60% at 25% -10%, rgba(255,255,255,.22), transparent 55%), radial-gradient(80% 50% at 90% 120%, rgba(255,255,255,.08), transparent 60%) }
html.lens .glass { -webkit-backdrop-filter: url(#lens-w) blur(1.5px) var(--glass-fx); backdrop-filter: url(#lens-w) blur(1.5px) var(--glass-fx) }
html.lens .glass.round { -webkit-backdrop-filter: url(#lens-r) blur(1px) var(--glass-fx); backdrop-filter: url(#lens-r) blur(1px) var(--glass-fx) }
/* tinted (regular) glass: thick enough to carry text */
.glass.sheet { background: var(--sheet); -webkit-backdrop-filter: blur(26px) saturate(1.8); backdrop-filter: blur(26px) saturate(1.8) }
html.lens .glass.sheet { -webkit-backdrop-filter: url(#lens-w) blur(18px) saturate(1.8); backdrop-filter: url(#lens-w) blur(18px) saturate(1.8) }
.glass.tint-p { background: color-mix(in srgb, var(--s-p) 85%, transparent) }
.glass.tint-g { background: color-mix(in srgb, var(--s-g) 82%, transparent) }
/* glass grows and brightens under the finger instead of shrinking */
.glass:active { transform: scale(1.06); filter: brightness(1.18) }
@media (prefers-reduced-transparency: reduce) {
  .glass, html.lens .glass, html.lens .glass.round, html.lens .glass.sheet { -webkit-backdrop-filter: none; backdrop-filter: none; background: var(--night) }
}
@media (prefers-reduced-motion: reduce) { .glass { transition: filter .2s ease-out } .glass:active { transform: none } }

button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer }
:focus-visible { outline: 2px solid var(--main-hi); outline-offset: 3px }
.ib { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center }
svg.i { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round }
.solid { height: 52px; border-radius: 26px; background: var(--main); color: var(--on-main); font-weight: 600; font-size: 17px; display: flex; align-items: center; justify-content: center; transition: transform .12s ease-out; width: 100% }
.solid.quiet { background: rgba(255,255,255,.1); color: var(--ink) }
.solid:active { transform: scale(.97) }
.chip { height: 36px; padding: 0 14px; border-radius: 18px; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 7px }

.t { font-weight: 700; letter-spacing: -.035em; line-height: .95 }
.lbl { font-size: 13px; font-weight: 600; color: var(--ink-2) }
.acc { color: var(--accent) }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none }
.p { background: var(--s-p) } .g { background: var(--s-g) } .y { background: var(--s-y) }
.st { display: flex; gap: 3px } .st i { width: 22px; height: 5px; border-radius: 3px }

/* sheet: inset 8 px from a 48 px screen corner, so 40 px keeps the corners concentric */
.sheet-b { position: absolute; left: 8px; right: 8px; bottom: 8px; border-radius: 40px; padding: 10px 20px 20px }
.grab { width: 38px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.3); margin: 0 auto 14px }
.rows > div { display: grid; grid-template-columns: 36px 1fr auto; gap: 12px; align-items: center; padding: 10px 0 }
.rows > div + div { border-top: 1px solid rgba(255,255,255,.08) }
.av { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #10131c }

/* tab bar: tabs in one capsule, Drive in its own circle, like the separate search button */
.tabbar { position: absolute; left: 20px; right: 20px; bottom: 24px; display: flex; gap: 10px; align-items: center }
.tabs { flex: 1; height: 62px; border-radius: 31px; display: grid; grid-template-columns: repeat(4, 1fr); padding: 4px }
.tab { display: grid; place-items: center; border-radius: 27px; color: var(--ink-2) }
.tab.on { color: var(--main-hi); background: rgba(255,255,255,.1) }
.go { width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center; color: var(--on-main); background: color-mix(in srgb, var(--main) 78%, transparent) }
.ndot { position: relative } .ndot::after { content: ""; position: absolute; top: 2px; right: 1px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent) }
/* ---------- home: drifting gradient shape ---------- */
.aura { position: absolute; inset: 0; z-index: -3; overflow: hidden }
.aura i { position: absolute; width: 360px; height: 360px; border-radius: 50%; filter: blur(50px); opacity: .75 }
.aura .a { left: -90px; top: 90px; background: var(--blob-a); animation: bloom-a 38s ease-in-out infinite alternate }
.aura .b { right: -120px; top: 420px; background: var(--blob-b); animation: bloom-b 46s ease-in-out infinite alternate }
.ribbon { position: absolute; left: -15px; top: 60px; width: 420px; height: 615px; z-index: -2; animation: sway 30s ease-in-out infinite alternate; will-change: transform }
@keyframes bloom-a { to { transform: translate(120px, 160px) scale(1.15) } }
@keyframes bloom-b { to { transform: translate(-140px, -120px) scale(.9) } }
@keyframes sway { from { transform: translate(-18px, 8px) rotate(-7deg) } to { transform: translate(24px, 40px) rotate(8deg) scale(1.06) } }
/* thin tinted glass: enough tint for text, little enough blur that the bent shape shows through */
.glass.lift { background: var(--sheet); -webkit-backdrop-filter: blur(5px) var(--glass-fx); backdrop-filter: blur(5px) var(--glass-fx) }
html.lens .glass.lift { -webkit-backdrop-filter: url(#lens-w) blur(4px) var(--glass-fx); backdrop-filter: url(#lens-w) blur(4px) var(--glass-fx) }
.pill { height: 72px; border-radius: 36px; display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; padding: 0 14px 0 16px }
.pill .av { width: 40px; height: 40px }
@media (prefers-reduced-motion: reduce) { .aura i, .ribbon { animation: none } }
@media (prefers-reduced-transparency: reduce) { .glass.lift, html.lens .glass.lift { -webkit-backdrop-filter: none; backdrop-filter: none; background: var(--night) } }
