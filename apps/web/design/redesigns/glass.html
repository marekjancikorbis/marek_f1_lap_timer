<title>Purple Sector · Glass</title>
<style>
/* Glass: the route map is always the ground; every control floats above it as liquid glass. */
:root {
  --night: #07080d;             /* midnight black */
  --blue: #2f6bff;              /* electric blue: what you press */
  --blue-hi: #7fa6ff;
  --melon: #ffa45b;             /* cantaloupe: records, race, alerts */
  --ink: #f2f5ff;
  --ink-2: rgba(242, 245, 255, .74);
  --s-p: #a970ff; --s-g: #3be07a; --s-y: #ffd43b;   /* sector colours, fixed by PLAN.md §9 */
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0 }
html, body { background: #050609; color: var(--ink); font: 15px/1.4 var(--font) }
body { padding-block: 24px 48px }
header.top { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
header.top a { color: var(--ink-2); text-decoration: none; font-size: 14px }
header.top h1 { font-size: 28px; letter-spacing: -.02em; font-weight: 700 }
.sw { display: flex; gap: 6px } .sw i { width: 18px; height: 18px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(255,255,255,.2) }

.wall { display: flex; gap: 36px; overflow-x: auto; padding: 24px max(16px, env(safe-area-inset-left, 0px)) 12px; scroll-snap-type: x proximity }
figure { flex: none; scroll-snap-align: center }
figcaption { margin-top: 14px; font-size: 13px; color: var(--ink-2); text-align: center }

/* ---------- phone ---------- */
.ph { width: 390px; height: 844px; border-radius: 48px; overflow: hidden; position: relative; isolation: isolate;
  background:
    radial-gradient(55% 38% at 15% 8%, rgba(47, 107, 255, .55), transparent 70%),
    radial-gradient(45% 30% at 95% 62%, rgba(255, 164, 91, .32), transparent 70%),
    radial-gradient(60% 40% at 30% 100%, rgba(47, 107, 255, .25), transparent 70%),
    var(--night);
  box-shadow: 0 0 0 9px #14161d, 0 0 0 10px #2a2d38, 0 40px 80px -30px rgba(0, 0, 0, .8);
  font-variant-numeric: tabular-nums }
.ph.dim { background: radial-gradient(70% 30% at 50% 0%, rgba(47,107,255,.18), transparent 70%), var(--night) }
.sb { height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 6px 32px 0 36px; font-size: 15px; font-weight: 600; position: relative; z-index: 5 }
.sb::after { content: ""; width: 66px; height: 12px; border-radius: 4px; background: linear-gradient(90deg, currentColor 0 18px, transparent 18px 23px, currentColor 23px 42px, transparent 42px 47px, currentColor 47px) }
.mapbg { position: absolute; inset: 0; z-index: -1 }
.mapbg path.road { fill: none; stroke: rgba(160, 180, 255, .09); stroke-width: 1.5 }

/* ---------- liquid glass ---------- */
.gl { position: relative; border-radius: 28px;
  background: linear-gradient(155deg, rgba(255,255,255,.17), rgba(255,255,255,.05) 38%, rgba(255,255,255,.08));
  -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.42), inset 0 0 0 1px rgba(255,255,255,.1), inset 0 -10px 20px -14px rgba(255,255,255,.18), 0 24px 40px -24px rgba(0,0,0,.7) }
.gl.thin { background: linear-gradient(155deg, rgba(255,255,255,.12), rgba(255,255,255,.04)); box-shadow: inset 0 1px 0 rgba(255,255,255,.3), inset 0 0 0 1px rgba(255,255,255,.08) }
.gl.blue { background: linear-gradient(160deg, rgba(120,160,255,.85), rgba(47,107,255,.78) 45%, rgba(30,70,210,.85)); box-shadow: inset 0 1px 0 rgba(255,255,255,.6), inset 0 -8px 16px -8px rgba(10,20,80,.5), 0 14px 30px -12px rgba(0,0,0,.6) }
@media (prefers-reduced-transparency: reduce) { .gl { background: #1a1d29; -webkit-backdrop-filter: none; backdrop-filter: none } .gl.blue { background: var(--blue) } }

button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer }
.btn { height: 52px; padding: 0 26px; border-radius: 999px; font-weight: 600; font-size: 17px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform .12s ease-out }
.btn:active, .orb:active, .ib:active, .tab:active { transform: scale(.96) }
.ib { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; transition: transform .12s ease-out }
svg.i { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round }
:focus-visible { outline: 2px solid var(--blue-hi); outline-offset: 3px }

/* ---------- type ---------- */
.t { font-weight: 700; letter-spacing: -.035em; line-height: .95 }
.lbl { font-size: 12px; font-weight: 600; letter-spacing: .02em; color: var(--ink-2) }
.mel { color: var(--melon) }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none }
.p { background: var(--s-p) } .g { background: var(--s-g) } .y { background: var(--s-y) }
.st { display: flex; gap: 3px } .st i { width: 18px; height: 5px; border-radius: 3px }

/* ---------- tab bar ---------- */
.tabs { position: absolute; left: 18px; right: 18px; bottom: 26px; height: 66px; border-radius: 33px; display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; z-index: 10; padding: 0 6px }
.tab { display: grid; place-items: center; height: 54px; border-radius: 27px; color: var(--ink-2); transition: transform .12s ease-out }
.tab.on { color: var(--ink); background: rgba(255,255,255,.12) }
.tab.go { width: 54px; height: 54px; margin: auto; border-radius: 50%; color: #fff }
.ndot { position: relative } .ndot::after { content: ""; position: absolute; top: -2px; right: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--melon) }

.row { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; padding: 12px 14px }
.av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; color: var(--night) }
.chip { height: 30px; padding: 0 14px; border-radius: 15px; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center }
.orb { width: 132px; height: 132px; border-radius: 50%; display: grid; place-items: center; font-size: 22px; font-weight: 700; color: #fff; transition: transform .14s ease-out }
.sep > * + * { border-top: 1px solid rgba(255,255,255,.08) }
</style>
</head>
