<!doctype html>
<html><head><meta charset="utf-8"><title>Timing Tower</title>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:#0B0B0D;color:#fff;font:400 15px/1.3 "Titillium Web",system-ui}
.top{height:56px;display:flex;align-items:center;padding:0 16px;font:700 20px "Titillium Web";text-transform:uppercase;border-bottom:3px solid #E10600}
h2{font:700 12px "Titillium Web";letter-spacing:.14em;color:#8A8A93;padding:16px 16px 8px;text-transform:uppercase}
.row{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid #1E1E24}
.pos{font:700 18px "Titillium Web";text-align:center;background:#1A1A1F;border-radius:4px;padding:2px 0}
.n{font-weight:600}.n small{display:block;color:#8A8A93;font-size:12px}
.t{font:700 22px "Titillium Web";font-variant-numeric:tabular-nums;text-align:right}
.s{display:flex;gap:2px;justify-content:flex-end;margin-top:4px}
.s i{width:26px;height:6px}
.tabs{position:absolute;bottom:0;left:0;right:0;height:78px;background:#111114;display:flex;justify-content:space-around;padding-top:12px;font:600 11px "Titillium Web";color:#8A8A93;text-transform:uppercase}
</style></head><body>
