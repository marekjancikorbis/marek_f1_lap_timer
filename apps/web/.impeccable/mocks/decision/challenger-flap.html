<!doctype html>
<html><head><meta charset="utf-8"><title>Split-Flap Board</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:#1C1C1C;color:#F4F4F0;font:500 15px/1.3 Oswald,system-ui}
.top{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#2A2A2A;border-bottom:2px solid #3A3A3A;text-transform:uppercase;letter-spacing:.06em}
.lamp{width:10px;height:10px;border-radius:50%;background:#F2A900;box-shadow:0 0 8px #F2A900}
.head{display:grid;grid-template-columns:1fr 112px;padding:12px 16px 6px;font-size:11px;color:#8C8C88;letter-spacing:.14em}
.row{display:grid;grid-template-columns:1fr 112px;gap:8px;padding:6px 16px}
.cells{display:flex;gap:2px}
.cells b{width:14px;height:24px;background:#0D0D0D;display:grid;place-items:center;font-size:15px;border-radius:2px;position:relative}
.cells b::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:#000}
.sub{grid-column:1/-1;font-size:12px;color:#8C8C88;letter-spacing:.08em}
.amber{color:#F2A900}
.tabs{position:absolute;bottom:0;left:0;right:0;height:78px;background:#2A2A2A;display:flex;justify-content:space-around;padding-top:12px;font-size:12px;color:#8C8C88;text-transform:uppercase}
</style></head><body>
<div class="top"><span>Purple Sector · Following</span><span class="lamp"></span></div>
<div class="head"><span>DRIVER / ROUTE</span><span>LAP</span></div>
<div class="row"><div class="cells"><b>T</b><b>O</b><b>M</b><b>A</b><b>S</b><b>_</b><b>K</b></div><div class="cells"><b>2</b><b>:</b><b>0</b><b>8</b><b>.</b><b>4</b></div><div class="sub">BRNO CIRCUIT · <span class="amber">P1 NEW PB</span> · 12 MIN</div></div>
<div class="row"><div class="cells"><b>L</b><b>U</b><b>C</b><b>I</b><b>E</b><b>.</b><b>S</b></div><div class="cells"><b>1</b><b>:</b><b>5</b><b>2</b><b>.</b><b>9</b></div><div class="sub">ECCE HOMO · P4 · 2 H</div></div>
<div class="row"><div class="cells"><b>P</b><b>E</b><b>T</b><b>R</b><b>_</b><b>V</b><b> </b></div><div class="cells"><b>1</b><b>:</b><b>4</b><b>4</b><b>.</b><b>0</b></div><div class="sub">MOST · P2 · 5 H</div></div>
<div class="row"><div class="cells"><b>J</b><b>A</b><b>N</b><b>A</b><b>.</b><b>H</b><b> </b></div><div class="cells"><b>2</b><b>:</b><b>1</b><b>4</b><b>.</b><b>6</b></div><div class="sub">BRNO CIRCUIT · P7 · 1 D</div></div>
<div class="tabs"><span style="color:#F4F4F0">Feed</span><span>Map</span><span>Search</span><span>Routes</span><span>Profile</span></div>
</body></html>
