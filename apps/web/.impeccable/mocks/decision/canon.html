<!doctype html>
<html><head><meta charset="utf-8"><title>Category standard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:#F4F5F7;color:#1F2328;font:400 15px/1.4 system-ui,sans-serif}
.top{height:56px;display:flex;align-items:center;padding:0 16px;background:#fff;font-weight:700;font-size:18px;border-bottom:1px solid #E3E5E8}
.card{background:#fff;margin:10px 0;padding:14px 16px}

.av{width:36px;height:36px;border-radius:50%;background:#D0D4DA}
.who small{display:block;font-weight:400;color:#6B7280;font-size:12px}
.map{height:150px;border-radius:8px;background:#E3E8EE;margin:12px 0}
.stats{display:flex;gap:24px}.stats small{display:block;color:#6B7280;font-size:12px}.stats b{font-size:18px}
.kudos{margin-top:12px;color:#FC5200;font-weight:600}
.tabs{position:absolute;bottom:0;left:0;right:0;height:78px;background:#fff;border-top:1px solid #E3E5E8;display:flex;justify-content:space-around;padding-top:12px;font-size:11px;color:#6B7280}
</style></head><body>
<div class="top">Purple Sector</div>
