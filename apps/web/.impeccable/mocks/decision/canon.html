<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>Category standard: Feed</title>
<style>
:root{--bg:#F2F3F5;--card:#fff;--ink:#1A1C20;--mute:#6B7078;--line:#E3E5E8;--orange:#FF5A1F;--purple:#8B3FE0;--green:#1FA64F;--yellow:#F5CF19}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
.top{background:#fff;padding:52px 16px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
.mark{font-weight:800;font-size:19px}
.icons{display:flex;gap:14px}.icons i{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink);display:block}
.card{background:#fff;margin-top:8px;padding:14px 16px}
.hd{display:flex;gap:10px;align-items:center}
.av{width:40px;height:40px;border-radius:50%;background:#D8DCE2}
.hd b{font-size:15px;display:block}.hd span{font-size:12px;color:var(--mute)}
.title{font-weight:700;font-size:18px;margin:10px 0 8px}
.stats{display:flex;gap:22px}
.stats div span{display:block;font-size:11px;color:var(--mute)}
.stats div b{font-size:20px;font-variant-numeric:tabular-nums}
.map{margin-top:12px;height:150px;border-radius:6px;background:linear-gradient(135deg,#E6EBE4,#DCE3DA);position:relative;overflow:hidden}
.map svg{position:absolute;inset:0}
.sec{display:flex;gap:4px;margin-top:10px}.sec i{flex:1;height:6px;border-radius:3px}
.p{background:var(--purple)}.g{background:var(--green)}.y{background:var(--yellow)}
.acts{display:flex;justify-content:space-around;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;color:var(--mute)}
.acts .race{color:var(--orange);font-weight:700}
.tabs{position:absolute;bottom:0;left:0;right:0;height:84px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:24px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;color:var(--mute)}
.tab i{width:22px;height:22px;border-radius:6px;border:2px solid currentColor;display:block}
.tab.on{color:var(--orange)}
.sample{position:absolute;top:18px;left:16px;font-size:10px;color:var(--mute)}
</style></head><body>
<div class="sample">SAMPLE DATA</div>
<header class="top"><div class="mark">Purple Sector</div><div class="icons"><i></i><i></i></div></header>
<article class="card">
  <div class="hd"><div class="av"></div><div><b>petra_r</b><span>Today · Ecce Homo hill-climb</span></div></div>
  <div class="title">New route record</div>
  <div class="stats"><div><span>Lap</span><b>2:11.47</b></div><div><span>Distance</span><b>3.42 km</b></div><div><span>Avg</span><b>94 km/h</b></div></div>
  <div class="map"><svg viewBox="0 0 358 150"><path d="M30 130 C70 110 60 70 120 66 S170 30 230 34 S320 20 330 14" stroke="#FF5A1F" stroke-width="4" fill="none" stroke-linecap="round"/></svg></div>
  <div class="sec"><i class="p"></i><i class="p"></i><i class="g"></i></div>
  <div class="acts"><span>Like</span><span>Comment</span><span class="race">Race this lap</span></div>
</article>
<article class="card">
  <div class="hd"><div class="av"></div><div><b>jan.k</b><span>Yesterday · Autodrom Most</span></div></div>
  <div class="title">Lap 6</div>
  <div class="stats"><div><span>Lap</span><b>1:38.902</b></div><div><span>Distance</span><b>4.21 km</b></div><div><span>Avg</span><b>153 km/h</b></div></div>
</article>
<nav class="tabs">
  <div class="tab on"><i></i>Feed</div><div class="tab"><i></i>Explore</div><div class="tab"><i></i>Drive</div><div class="tab"><i></i>Routes</div><div class="tab"><i></i>Profile</div>
</nav>
</body></html>
